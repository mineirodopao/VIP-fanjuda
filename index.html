<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maah Franjuda</title>

    <!-- ÍCONE DA ABA -->
    <link rel="icon" type="image/jpeg" href="./icone.jpeg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.72)
                ),
                url("./fundo.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* FOTO */
        .profile {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .profile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            text-align: center;
        }

        /* ESCOLHA DE PAÍS */
        .country-screen {
            width: 100%;
            text-align: center;
        }

        .country-screen h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .country-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .country-button {
            width: 100%;
            min-height: 65px;
            border: none;
            border-radius: 18px;
            cursor: pointer;

            background: rgba(255,255,255,0.13);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.25);

            color: white;
            font-size: 18px;
            font-weight: bold;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            transition: 0.25s;
        }

        .country-button:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.22);
        }

        /* BANDEIRAS */
        .flag {
            width: 38px;
            height: 25px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .flag-br {
            background: #229e45;
        }

        .flag-br::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: #f7d117;
            transform: rotate(45deg);
            left: 9px;
            top: 2px;
        }

        .flag-br::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #2455a4;
            border-radius: 50%;
            left: 14px;
            top: 7px;
        }

        .flag-us {
            background: repeating-linear-gradient(
                to bottom,
                #b22234 0px,
                #b22234 3px,
                white 3px,
                white 6px
            );
        }

        .flag-us::before {
            content: "";
            position: absolute;
            width: 17px;
            height: 13px;
            background: #3c3b6e;
            left: 0;
            top: 0;
        }

        /* CONTEÚDO */
        .content {
            display: none;
            width: 100%;
        }

        .content.active {
            display: block;
        }

        .content-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            width: 100%;
            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: white;

            font-size: 17px;
            font-weight: bold;

            border-radius: 16px;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.25);

            box-shadow: 0 6px 20px rgba(0,0,0,0.25);

            transition: 0.25s;
        }

        .link-button:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(255,255,255,0.23);
        }

        .back-button {
            margin-top: 20px;
            width: 100%;
            min-height: 45px;

            border: none;
            border-radius: 14px;

            background: rgba(0,0,0,0.35);
            color: white;

            cursor: pointer;
            font-size: 15px;

            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(0,0,0,0.55);
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- PERFIL -->
    <div class="profile">
        <img src="./perfil.jpeg" alt="Perfil">
    </div>

    <h1>Maah Franjuda</h1>
    <p class="subtitle">Escolha seu país</p>

    <!-- ESCOLHA DO PAÍS -->
    <div class="country-screen" id="countryScreen">

        <h2>Selecione uma opção</h2>

        <div class="country-buttons">

            <button class="country-button" onclick="selectCountry('br')">
                <span class="flag flag-br"></span>
                Brasil
            </button>

            <button class="country-button" onclick="selectCountry('us')">
                <span class="flag flag-us"></span>
                United States
            </button>

        </div>

    </div>

    <!-- BRASIL -->
    <div class="content" id="brContent">

        <div class="content-title">
            🇧🇷 Conteúdos para o Brasil
        </div>

        <div class="links">

            <a
                class="link-button"
                href="https://privacy.com.br/checkout/maah_franjudinha"
                target="_blank"
                rel="noopener noreferrer"
            >
                Meu Privacy
            </a>

            <a
                class="link-button"
                href="https://t.me/maah_franjuda_bot"
                target="_blank"
                rel="noopener noreferrer"
            >
                Grupo VIP
            </a>

        </div>

        <button class="back-button" onclick="backToCountries()">
            ← Voltar
        </button>

    </div>

    <!-- ESTADOS UNIDOS -->
    <div class="content" id="usContent">

        <div class="content-title">
            🇺🇸 Content for United States
        </div>

        <div class="links">

            <a
                class="link-button"
                href="https://privacy.com.br/checkout/maah_franjudinha"
                target="_blank"
                rel="noopener noreferrer"
            >
                My Privacy
            </a>

            <a
                class="link-button"
                href="https://t.me/maahfranjuda_bot"
                target="_blank"
                rel="noopener noreferrer"
            >
                VIP Group
            </a>

        </div>

        <button class="back-button" onclick="backToCountries()">
            ← Back
        </button>

    </div>

    <div class="footer">
        © 2026 Maah Franjuda
    </div>

</div>

<script>

    function selectCountry(country) {

        document.getElementById("countryScreen").style.display = "none";

        document.getElementById("brContent").classList.remove("active");
        document.getElementById("usContent").classList.remove("active");

        if (country === "br") {
            document.getElementById("brContent").classList.add("active");
        }

        if (country === "us") {
            document.getElementById("usContent").classList.add("active");
        }
    }

    function backToCountries() {

        document.getElementById("brContent").classList.remove("active");
        document.getElementById("usContent").classList.remove("active");

        document.getElementById("countryScreen").style.display = "block";
    }

</script>

</body>
</html>
